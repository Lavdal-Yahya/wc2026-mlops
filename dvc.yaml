# DVC pipeline — reproducible stages (PDF §5).
#
# Run the whole pipeline:      dvc repro
# Push tracked data to S3:      dvc push
# Pull it on another machine:   dvc pull
#
# The two required data versions come from params.yaml -> features.version.
# DVC watches that param below, so switching v1 <-> v2 and running `dvc repro`
# regenerates the outputs; commit the resulting dvc.lock to snapshot each version.
stages:
  preprocess:
    cmd: python -m scripts.preprocess
    deps:
      - scripts/preprocess.py
      - src/data/load.py
      - src/data/splits.py
      - src/features
      - data/raw
    params:
      - seed
      - features.version
      - features.rolling.window_matches
      - validation.train_end
      - validation.val_end
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/ratings_snapshot.joblib

  train:
    cmd: python -m scripts.train
    deps:
      - scripts/train.py
      - src/evaluation/metrics.py
      - data/processed/train.csv
    params:
      - seed
      - features.version
      - models
      - validation.cv.n_splits
    outs:
      - models/model.joblib

  evaluate:
    cmd: python -m scripts.evaluate
    deps:
      - scripts/evaluate.py
      - src/evaluation/metrics.py
      - models/model.joblib
      - data/processed/test.csv
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/calibration_curve.png:
          cache: false
      - reports/confusion_matrix.png:
          cache: false
